services:
  tokeng-server:
    build: .
    image: tokeng-server:${VERSION:-6.2.0}
    container_name: tokeng-server
    labels:
      org.tokeng.service: "tokeng-server"
      org.tokeng.version: "6.2.0"
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:${PORT:-8088}"
    environment:
      - VERSION=${VERSION:-6.2.0}
      - PORT=${PORT:-8088}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_TTL=${TOKEN_TTL:-720h}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-1048576}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-10s}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-10}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      - DB_MAX_CONNS=${DB_MAX_CONNS:-15}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-2}
    healthcheck:
      test: ["CMD", "/app/tokeng-server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
